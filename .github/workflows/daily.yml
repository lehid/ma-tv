name: Mise à jour quotidienne

on:
  schedule:
    - cron: '17 3 * * *' # chaque nuit vers 4h-5h (heure de Paris)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['config.json', 'scripts/**', 'web/**', 'public/**', '.github/workflows/**']

# Par défaut : lecture seule. Seul le job « deploy » reçoit le droit de publier.
permissions:
  contents: read

# Un groupe par branche : un run de test (ex. fix/ci) n'annule plus le run de main, et inversement.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exécute le code tiers d'iptv-org/epg (npm ci + grabber) dans un job SANS droit d'écriture :
  # même compromis, il ne peut ni publier le site ni toucher au repo.
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true # sans guide, le site et la playlist restent utilisables
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Préparer la liste EPG
        run: npm run epg:channels
      - name: Télécharger le guide TV (iptv-org/epg)
        timeout-minutes: 40
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg/iptv-org-epg
          cd epg/iptv-org-epg
          npm ci --no-audit --no-fund
          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/epg/channels.xml" \
            --output="$GITHUB_WORKSPACE/out/guide.xml" \
            --days="$(node -p "require('$GITHUB_WORKSPACE/config.json').epg?.days ?? 2")" \
            --maxConnections=5 --timeout=15000 --gzip
      - uses: actions/upload-artifact@v4
        with:
          name: guide
          path: out/guide.xml.gz
          retention-days: 2

  build:
    needs: epg
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Vérifier les flux de ma sélection
        run: npm run check

      - name: Générer les playlists
        run: npm run playlist

      - name: Récupérer le guide TV (job isolé)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: guide
          path: public

      - name: Alléger le guide pour le site
        run: npm run epg:now

      - name: Statistiques
        run: npm run stats

      - name: Construire le site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Seul main publie : les autres branches servent à tester epg + build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
