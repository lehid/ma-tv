<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ma TV</title>
  <meta name="description" content="Chaînes TV publiques du monde entier, filtrables, lisibles au navigateur ou sur Smart TV.">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <form class="toolbar" id="filters" role="search" onsubmit="return false">
      <label class="search"><span class="i i-search" aria-hidden="true"></span>
        <input id="q" type="search" placeholder="Rechercher une chaîne" aria-label="Rechercher une chaîne" autocomplete="off"></label>
      <select id="country" aria-label="Pays"><option value="">Tous les pays</option></select>
      <button type="button" class="filters-btn" id="filters-btn" aria-expanded="false" aria-controls="filters-panel">
        <span class="i i-sliders" aria-hidden="true"></span>Filtres<span class="count" id="filters-count" hidden></span>
      </button>
      <div class="filters-panel" id="filters-panel" hidden>
        <div class="field"><span class="field-label">Liste</span>
          <div class="seg" id="scope">
            <button type="button" data-v="mine" aria-pressed="true">Ma sélection</button>
            <button type="button" data-v="world" aria-pressed="false">Monde</button>
          </div>
        </div>
        <label class="field"><span class="field-label">Langue</span><select id="lang"><option value="">Toutes</option></select></label>
        <label class="field"><span class="field-label">Chaînes adultes</span>
          <select id="nsfw"><option value="show">Affichées, marquées 18+</option><option value="hide">Masquées</option><option value="only">Uniquement</option></select>
        </label>
        <label class="field"><span class="field-label">Disponibilité</span>
          <select id="alive"><option value="">Toutes</option><option value="ok">En ligne au dernier contrôle</option><option value="nogeo">Sans restriction de pays</option><option value="official">Sources officielles uniquement</option></select>
        </label>
        <div class="field"><span class="field-label">Playlist</span>
          <button type="button" id="download"><span class="i i-download" aria-hidden="true"></span>Télécharger en M3U</button>
        </div>
      </div>
    </form>
    <nav class="chips" id="chips" aria-label="Catégories"></nav>
    <p class="summary" id="summary" aria-live="polite">Chargement des chaînes…</p>
    <div id="list"></div>
    <button type="button" class="more" id="more" hidden>Afficher plus</button>
  </main>
  <div class="dial" id="dial" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
