<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stats · Ma TV</title>
  <meta name="theme-color" content="#0d0d0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <div class="kpis" id="kpis"></div>
    <section class="panel map-panel">
      <h2>Chaînes par pays</h2>
      <div class="map-wrap" id="map" role="img" aria-label="Carte du monde du nombre de chaînes par pays"></div>
      <div class="legend" id="legend"></div>
      <details class="table-view">
        <summary>Voir le tableau des pays</summary>
        <div class="table-scroll"><table id="country-table"><thead><tr><th scope="col">Pays</th><th scope="col">Chaînes</th></tr></thead><tbody></tbody></table></div>
      </details>
    </section>
    <div class="panels">
      <section class="panel"><h2>Top 15 des pays</h2><div class="bars" id="countries"></div></section>
      <section class="panel panel-tall"><h2>Chaînes par catégorie</h2><div class="bars" id="cats"></div></section>
      <section class="panel"><h2>Top 15 des langues</h2><div class="bars" id="langs"></div></section>
      <section class="panel"><h2>Flux par qualité d'image</h2><div class="bars" id="quality"></div></section>
    </div>
  </main>
  <div class="tooltip" id="tip" hidden></div>
  <script type="module" src="./src/stats.js"></script>
</body>
</html>
